name: EduVibe CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ===========================================================================
  # Stage 1: Syntax & Code Quality Verification (Runs on GitHub Cloud)
  # ===========================================================================
  test-and-lint:
    name: 🧪 Syntax & Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend Syntax & Integrity Check
        run: |
          cd backend
          node -c server.js routes/*.js middleware/*.js models/*.js utils/*.js
          echo "✅ All backend JavaScript syntax checks passed cleanly!"

  # ===========================================================================
  # Stage 2: Docker Build Verification (Tests Container Builds on GitHub Cloud)
  # ===========================================================================
  build-containers:
    name: 🐳 Docker Build Verification
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: eduvibe-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: eduvibe-frontend:latest

  # ===========================================================================
  # Stage 3: Continuous Deployment with Dynamic AWS EC2 IP Discovery
  # ===========================================================================
  deploy-to-ec2:
    name: 🚀 Dynamic AWS EC2 Deployment
    needs: build-containers
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Discover EC2 State & Dynamic Public IP
        id: ec2-discover
        run: |
          # Use secret EC2_INSTANCE_ID if provided, else look up by project tag
          TARGET_INSTANCE="${{ secrets.EC2_INSTANCE_ID }}"
          if [ -z "$TARGET_INSTANCE" ]; then
            echo "🔍 EC2_INSTANCE_ID secret not provided, discovering by tag Name=eduvibe-cloud-server..."
            TARGET_INSTANCE=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=eduvibe-cloud-server" "Name=instance-state-name,Values=pending,running,stopped,stopping" \
              --query "Reservations[0].Instances[0].InstanceId" --output text)
          fi

          echo "Target Instance ID: $TARGET_INSTANCE"
          echo "instance_id=$TARGET_INSTANCE" >> $GITHUB_OUTPUT

          if [ -z "$TARGET_INSTANCE" ] || [ "$TARGET_INSTANCE" = "None" ]; then
            echo "is_running=false" >> $GITHUB_OUTPUT
            echo "⚠️ No active EC2 instance found (it may be stopped or destroyed). Skipping deployment safely."
            exit 0
          fi

          STATE=$(aws ec2 describe-instances --instance-ids "$TARGET_INSTANCE" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "EC2 Instance State: $STATE"

          if [ "$STATE" != "running" ]; then
            echo "is_running=false" >> $GITHUB_OUTPUT
            echo "⚠️ EC2 instance ($TARGET_INSTANCE) is currently $STATE. Skipping deployment safely."
            exit 0
          fi

          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$TARGET_INSTANCE" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          echo "is_running=true" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "🎯 Discovered live active EC2 Public IP: $PUBLIC_IP"

      - name: Deploy Application to EC2 via SSH
        if: steps.ec2-discover.outputs.is_running == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2-discover.outputs.public_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "========================================================="
            echo "🚀 Deploying EduVibe on AWS EC2..."
            echo "========================================================="
            mkdir -p /home/ubuntu/EduVibe-LMS
            cd /home/ubuntu/EduVibe-LMS

            # Clone repository if first time, or pull latest updates
            if [ ! -d ".git" ]; then
              git clone https://github.com/ajaygangwar945/EduVibe-LMS.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            # Rebuild and restart all application containers (including Prometheus & Grafana)
            docker compose --profile monitoring up -d --build

            # Cleanup unused dangling Docker images to preserve disk space
            docker image prune -f

            echo "========================================================="
            echo "✅ EduVibe Deployment Completed Successfully on EC2!"
            echo "========================================================="
