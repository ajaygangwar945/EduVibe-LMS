<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="badgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#121620" />
    </linearGradient>
    <linearGradient id="badgeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f3f8" />
    </linearGradient>
    <style>
      .badge-bg {
        fill: url(#badgeDark);
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 3;
      }
      .cap-icon {
        stroke: #007aff;
      }
      @media (prefers-color-scheme: light) {
        .badge-bg {
          fill: url(#badgeLight);
          stroke: rgba(0, 0, 0, 0.12);
        }
        .cap-icon {
          stroke: #007aff;
        }
      }
    </style>
  </defs>

  <!-- Apple Squircle Badge Container Matching Login Brand Icon -->
  <rect class="badge-bg" x="6" y="6" width="88" height="88" rx="24" />

  <!-- Exact Vector Graduation Cap Icon from Login Page -->
  <g transform="translate(18, 18) scale(2.66)" fill="none" class="cap-icon" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
    <path d="M6 12v5c3 3 9 3 12 0v-5" />
  </g>
</svg>
