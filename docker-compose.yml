name: eduvibe

services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB Database Container
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: eduvibe-mongo
    restart: always
    # Security: Bind to unreserved port to avoid conflict with local Windows MongoDB service
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - mongo_data:/data/db
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 2. Visual Web Viewer for MongoDB (Open http://localhost:8081 in Chrome)
  # ---------------------------------------------------------------------------
  mongo-express:
    image: mongo-express:latest
    container_name: eduvibe-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      # Security: Enforce basic authentication to prevent unauthenticated database manipulation
      - ME_CONFIG_BASICAUTH=true
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-EduVibeSecure2026!}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 3. Node.js Express API Container
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduvibe-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET:-eduvibe_docker_jwt_key_2026}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-ajay.12322931@lpu.in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-123456}
      - RESEND_API_KEY=${RESEND_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - uploads_data:/app/uploads
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 4. React Frontend Container (Nginx) - Port 3005
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduvibe-frontend
    restart: always
    ports:
      - "3005:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 5. Prometheus Metrics Scraper (Profile: monitoring)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: eduvibe-prometheus
    restart: always
    profiles: ["monitoring", "all"]
    ports:
      - "9090:9090"
    volumes:
      - ./devops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 6. Grafana Real-Time Analytics Dashboard (Profile: monitoring)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: eduvibe-grafana
    restart: always
    profiles: ["monitoring", "all"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-EduVibeGrafana2026!}
    depends_on:
      - prometheus
    networks:
      - eduvibe-network

# -----------------------------------------------------------------------------
# Persistent Volumes (Data never gets lost on restart)
# -----------------------------------------------------------------------------
volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  eduvibe-network:
    name: eduvibe-network
    driver: bridge
