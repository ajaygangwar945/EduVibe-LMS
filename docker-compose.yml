name: eduvibe

services:
  # ---------------------------------------------------------------------------
  # 1. Node.js Express API Container (Connects to MongoDB Atlas Cloud)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduvibe-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RESEND_API_KEY=${RESEND_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - uploads_data:/app/uploads
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 2. React Frontend Container (Nginx) - Port 3005
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduvibe-frontend
    restart: always
    ports:
      - "3005:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 3. Prometheus Metrics Scraper (Profile: monitoring)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: eduvibe-prometheus
    restart: always
    profiles: ["monitoring", "all"]
    ports:
      - "9090:9090"
    volumes:
      - ./devops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 4. Grafana Real-Time Analytics Dashboard (Profile: monitoring)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: eduvibe-grafana
    restart: always
    profiles: ["monitoring", "all"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - eduvibe-network

# -----------------------------------------------------------------------------
# Persistent Volumes (Uploaded PDFs & Lecture Materials)
# -----------------------------------------------------------------------------
volumes:
  uploads_data:
    driver: local

networks:
  eduvibe-network:
    name: eduvibe-network
    driver: bridge
