services:
  # ---------------------------------------------------------------------------
  # 1. Prometheus Metrics Scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: eduvibe-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - eduvibe-network

  # ---------------------------------------------------------------------------
  # 2. Grafana Real-Time Analytics Dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: eduvibe-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - eduvibe-network

networks:
  eduvibe-network:
    name: eduvibe-lms_eduvibe-network
    external: true
