name: eduvibe

services:
  mongo:
    image: mongo:7.0
    container_name: eduvibe-mongo
    restart: always
    # Security: Bind to unreserved port to avoid conflict with local Windows MongoDB service
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - mongo_data:/data/db
    networks:
      - eduvibe-network

  mongo-express:
    image: mongo-express:latest
    container_name: eduvibe-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      # Security: Enforce basic authentication to prevent unauthenticated database manipulation
      - ME_CONFIG_BASICAUTH=true
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-EduVibeSecure2026!}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - eduvibe-network

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: eduvibe-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/eduvibe
      - JWT_SECRET=${JWT_SECRET:-eduvibe_docker_jwt_key_2026}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@eduvibe.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminSecure2026!}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - uploads_data:/app/uploads
    networks:
      - eduvibe-network

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: eduvibe-frontend
    restart: always
    ports:
      - "3005:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eduvibe-network

  prometheus:
    image: prom/prometheus:latest
    container_name: eduvibe-prometheus
    restart: always
    profiles: ["monitoring", "all"]
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - eduvibe-network

  grafana:
    image: grafana/grafana:latest
    container_name: eduvibe-grafana
    restart: always
    profiles: ["monitoring", "all"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-EduVibeGrafana2026!}
    depends_on:
      - prometheus
    networks:
      - eduvibe-network

volumes:
  mongo_data:
  uploads_data:

networks:
  eduvibe-network:
    name: eduvibe-network
    driver: bridge
