apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: eduvibe-frontend
spec:
  replicas: 2 # High Availability (2 copies of React frontend)
  selector:
    matchLabels:
      app: eduvibe-frontend
  template:
    metadata:
      labels:
        app: eduvibe-frontend
    spec:
      containers:
        - name: frontend
          image: eduvibe-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: eduvibe-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30005 # Exposes on port 30005 of your Kubernetes cluster
  selector:
    app: eduvibe-frontend
